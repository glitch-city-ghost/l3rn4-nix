# ==========================================================
# l3rn4 :: dash config
# shellcheck disable=SC2034
# Sourced by scripts/dash, so this file is bash, not a data
# format. Keep it trusted: it runs with your permissions.
#
# The user copy wins:
#   ~/.config/l3rn4/dash.conf
# Create it with `dash init` and edit it.
# Until then, this packaged copy is used.
#
# Profiles:  DASH_CONFIG=~/.config/l3rn4/dash.dev.conf dash
# ==========================================================

# --- tmux server -----------------------------------------
# A private socket: normal tmux sessions are not touched.
dash_socket="${DASH_SOCKET:-l3rn4}"
dash_session="${DASH_SESSION:-hydra}"

# --- layout ----------------------------------------------
# main             first pane on the left, the rest stacked right
# main-horizontal  first pane on top,  the rest side by side below
# grid             equal tiles
# horizontal       all panes side by side
# vertical         all panes stacked
dash_layout="${DASH_LAYOUT:-main}"

# Size of the first pane (main / main-horizontal).
# At 210 columns this is 105 columns + the 1-column divider.
dash_main_width="${DASH_MAIN_WIDTH:-50%}"
dash_main_height="${DASH_MAIN_HEIGHT:-45%}"

# `main` layout: grow this pane to at least this many rows.
# btop's four-box view needs 24 rows; htop works in less.
dash_tall_pane="${DASH_TALL_PANE:-btop}"
dash_tall_height="${DASH_TALL_HEIGHT:-26}"
# Other panes below the tall one keep at least this many rows.
# proxy gets 13, logs takes the 14-row remainder at 54 rows total.
dash_side_height="${DASH_SIDE_HEIGHT:-14}"

# Focused pane after attach: 0-based index in pane order.
dash_focus="${DASH_FOCUS:-0}"

# tmux chrome.
dash_prefix="${DASH_PREFIX:-C-b}"
dash_mouse="${DASH_MOUSE:-on}"
dash_status="${DASH_STATUS:-on}"
dash_borders="${DASH_BORDERS:-on}"
dash_term="${DASH_TERM:-tmux-256color}"

# Directory for every pane.
dash_workdir="${DASH_WORKDIR:-$HOME}"

# Shell to drop into after a pane command exits.
# This keeps the four-pane layout when you quit btop or logs.
dash_fallback_shell="${DASH_FALLBACK_SHELL:-bash}"

# --- mihomo status pane -----------------------------------
# Exported, so proxy-status inherits them.
export MIHOMO_GROUP="${MIHOMO_GROUP:-SMART-FALLBACK}"
# export MIHOMO_API="http://172.17.0.1:9090 http://127.0.0.1:9090"
export MIHOMO_SECRET="mysecretpassword"
# The panel reads ~/.config/l3rn4/mihomo.secret when MIHOMO_SECRET is unset.
# chmod 600 it and keep the real secret out of this file / git.
# export MIHOMO_REFRESH=2
# export MIHOMO_CHECK_EVERY=30
# export MIHOMO_PROXY_URL="http://127.0.0.1:7890"

# --- panes ------------------------------------------------
# pane "<title>" <program> [args...]
# Order matters: the first pane is the main one in
# `main` and `main-horizontal` layouts.
#
# Use bash -c '...' for pipes, redirection, cd and friends.
#
# Examples:
#   pane "agent" opencode
#   pane "editor" nvim
#   pane "shell" bash
#   pane "docker" docker events
#   pane "work" bash -c 'cd ~/src/app && exec zsh'
#   pane "traefik" docker logs -f --tail=100 traefik

pane "shell" "${SHELL:-bash}"
pane "proxy" proxy-status
pane "btop" btop --force-utf
pane "logs" ~/hydr4-agent/hydra logs
