# Source:          ~/.config/starship/cybrcore.toml
# ---------------------------------------

scan_timeout = 100

format = """
$username\
[](fg:no1 bg:re2)\
$shell\
[](fg:re2 bg:re0)\
$directory\
[](fg:re0)\
$git_branch\
$git_status\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nim\
$rust\
$scala\
$docker_context\
$time\
$character
"""

palette = "cybr_ship"

[username]
show_always = true
style_user = "bg:no1 fg:re0"
format = '[ $user ]($style)'
disabled = false

[shell]
style = "bg:re2 fg:re0"
format = '[ $indicator ]($style)'
disabled = false

[directory]
style = "fg:re2 bg:re0"
format = "[ $path ](bold $style)"
truncation_length = 3
truncation_symbol = "…/"

[line_break]
disabled = false

[jobs]
disabled = true


[character]
success_symbol = "[](bg:re0 fg:cy2)[❯ ](fg:no0 bg:re0)[](fg:re0) "
error_symbol = "[](bg:or0 fg:cy2)[✗ ](fg:no0 bg:or0)[](fg:or0) "
vicmd_symbol = "[](bg:ye0 fg:cy2)[❯ ](fg:no0 bg:ye0)[](fg:ye0) "
format = "$symbol"

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:cy0 bg:cy2"
format = '[](fg:cy2)[ $time ]($style)'

[palettes.cybr_ship]
no0 = "@base.bg@" # Наш тёмно-вишнёвый фон
no1 = "@base.bg_alt@" # Альтернативный фон

re0 = "@text.main@" # Кислотно-розовый (основной акцент Vim)
re2 = "@shade.red@" # Тёмно-красный фон

gr0 = "@accents.green@" # Неоново-зелёный
gr2 = "@shade.green@"

ye0 = "@accents.yellow@" # Жёлтый
ye2 = "@shade.yellow@"

bl0 = "@accents.blue@" # Неоново-синий
bl2 = "@shade.blue@"

pu0 = "@accents.purple@" # Фиолетовый (функции)
pu2 = "@shade.purple@"

cy0 = "@accents.cyan@" # Бирюзовый (директории)
cy2 = "@shade.cyan@"

wh0 = "@text.light@" # Ледяной белый
wh2 = "@shade.neutral@"

me0 = "@shade.steel@"
me2 = "@shade.navy@"

or0 = "@accents.orange@"
or2 = "@shade.orange@"

[git_branch]
symbol = ""
style = "bg:pu2 fg:pu0"
format = "[](fg:pu2)[ $symbol $branch ]($style)[](fg:pu2)"

[git_status]
style = "bg:pu0 fg:pu2"   # hlavní blok
format = "[](fg:pu0)[ $all_status$ahead_behind ]($style)[](fg:pu0)"

[c]
symbol = ""
style = "bg:bl2 fg:bl0"
format = "[](fg:pu2 bg:bl2)[ $symbol ($version) ]($style)"

[cpp]
symbol = ""
style = "bg:bl2 fg:bl0"
format = "[ $symbol ($version) ]($style)"

[elm]
symbol = ""
style = "bg:bl2 fg:bl0"
format = "[ $symbol ($version) ]($style)"

[golang]
symbol = ""
style = "bg:bl2 fg:bl0"
format = "[ $symbol ($version) ]($style)"

[gradle]
style = "bg:cy2 fg:cy0"
format = "[](fg:bl2 bg:cy2)[ $symbol ($version) ]($style)"

[julia]
symbol = ""
style = "bg:cy2 fg:cy0"
format = "[ $symbol ($version) ]($style)"

[java]
symbol = ""
style = "bg:or2 fg:or0"
format = "[](fg:cy2 bg:or2)[ $symbol ($version) ]($style)"

[rust]
symbol = ""
style = "bg:or2 fg:or0"
format = "[ $symbol ($version) ]($style)"

[python]
symbol = ""
style = "bg:ye2 fg:ye0"
format = "[](fg:or2 bg:ye2)[ $symbol ($version) ]($style)"

[nim]
symbol = "󰆥"
style = "bg:ye2 fg:ye0"
format = "[ $symbol ($version) ]($style)"

[haskell]
symbol = ""
style = "bg:pu2 fg:pu0"
format = "[](fg:ye2 bg:pu2)[ $symbol ($version) ]($style)"

[elixir]
symbol = ""
style = "bg:pu2 fg:pu0"
format = "[ $symbol ($version) ]($style)"

[scala]
symbol = ""
style = "bg:re2 fg:re0"
format = "[](fg:pu2 bg:re2)[ $symbol ($version) ]($style)"

[docker_context]
symbol = ""
style = "bg:bl2 fg:bl0"
format = "[](fg:re2 bg:bl2)[ $symbol $context ]($style)"
