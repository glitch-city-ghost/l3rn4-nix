# ==========================================================
# l3rn4 :: btop
# Process monitor for the tmux dashboard.
#
# The dashboard pane is narrow, so this config shows only the
# process box. For the full btop view remove `shown_boxes` (or
# set "cpu mem net proc") and zoom the pane with the tmux prefix.
#
# Theme: themes/cyberpunk/btop/cyberpunk.theme (generated from cyberpunk-palette.yaml).
# ==========================================================

color_theme = "cyberpunk"
theme_background = true
truecolor = true
force_tty = false

rounded_corners = true
terminal_sync = true
vim_keys = false

shown_boxes = "proc"
update_ms = 2000

proc_sorting = "cpu lazy"
proc_reversed = false
proc_tree = false
proc_colors = true
proc_gradient = true
proc_per_core = false
proc_mem_bytes = true
proc_cpu_graphs = true
proc_info_smaps = false
proc_left = false
proc_filter_kernel = false
proc_follow_detailed = true
proc_aggregate = false
proc_tree_auto_collapse = 0
keep_dead_proc_usage = false

graph_symbol = "braille"
clock_format = "%X"
background_update = true

# WSL has no battery/temperature sensors here; keep the UI quiet.
show_battery = false
check_temp = false
show_cpu_watts = false

log_level = "WARNING"
