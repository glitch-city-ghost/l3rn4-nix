# ==========================================================
# l3rn4 :: btop
# Resource monitor for the tmux dashboard.
#
# Full default view: cpu, mem, net and proc boxes are all
# selected, so keys 1-4 switch between them and btop does not
# start up looking like a bare process viewer.
#
# GPU monitoring is disabled on purpose. btop's NVML backend
# runs at startup whenever `shown_gpus` contains "nvidia" (the
# default, even with no GPU box shown) and is known to hang or
# spin on WSL2. Setting `shown_gpus` to an empty string skips
# the NVML/RSMI initialisation entirely.
#
# `terminal_sync` (DECSET 2026 synchronized output) is off as a
# second mismatch guard for Windows Terminal/ConPTY. Turn it
# back on if btop starts flickering and your terminal handles
# synchronized output correctly.
#
# Theme: themes/cyberpunk/btop/cyberpunk.theme (generated from cyberpunk-palette.yaml).
# ==========================================================

color_theme = "cyberpunk"
theme_background = true
truecolor = true
force_tty = false

rounded_corners = true
terminal_sync = false
vim_keys = false

shown_boxes = "cpu mem net proc"
update_ms = 2000

proc_sorting = "cpu lazy"
proc_reversed = false
proc_tree = false
proc_colors = true
proc_gradient = true
proc_per_core = false
proc_mem_bytes = true
proc_cpu_graphs = true
proc_info_smaps = false
proc_left = false
proc_filter_kernel = false
proc_follow_detailed = true
proc_aggregate = false
proc_tree_auto_collapse = 0
keep_dead_proc_usage = false

graph_symbol = "braille"
clock_format = "%X"
background_update = true

# WSL has no battery/temperature sensors here; keep the UI quiet.
show_battery = false
check_temp = false
show_cpu_watts = false

# GPUs on WSL are proxied through the Windows driver. Querying NVML/RSMI
# from Linux is unreliable there (btop #1311 hangs at startup, #1868
# misdetects the driver), and btop initialises NVML at startup even when
# no GPU box is shown (#1831). An empty `shown_gpus` is the only way to
# skip that init.
show_gpu_info = "Off"
shown_gpus = ""
nvml_measure_pcie_speeds = false
rsmi_measure_pcie_speeds = false

log_level = "WARNING"
