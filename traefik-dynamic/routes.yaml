# Static routes for the Traefik file provider.
# The Docker provider is disabled, so new containers must be added here.
http:
  routers:
    # Красивый домен для дашборда Traefik
    traefik-dashboard:
      rule: "Host(`traefik.localhost`)"
      entryPoints:
        - web
      service: api@internal

    # Красивый домен для Zashboard
    mihomo-dashboard:
      rule: "Host(`mihomo.localhost`)"
      entryPoints:
        - web
      service: mihomo-service

    # OpenCode Web UI
    hydr4-agent:
      rule: "Host(`agent.localhost`)"
      entryPoints:
        - web
      service: hydr4-agent

    # FreeLLMAPI dashboard / gateway
    hydr4-gateway:
      rule: "Host(`api.localhost`)"
      entryPoints:
        - web
      service: hydr4-gateway

  services:
    mihomo-service:
      loadBalancer:
        servers:
          # Идем через host.docker.internal на порт 9090
          - url: "http://host.docker.internal:9090"

    hydr4-agent:
      loadBalancer:
        servers:
          - url: "http://hydr4-agent:4096"

    hydr4-gateway:
      loadBalancer:
        servers:
          - url: "http://hydr4-gateway:3001"
